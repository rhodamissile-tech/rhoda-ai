
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RHODA AI</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
}
header {
  background: #172b46;
  padding: 22px;
  text-align: center;
}
header h1 { color: #55d6be; margin: 0; }
header p { color: #d2dbea; }
main {
  max-width: 650px;
  margin: 25px auto;
  padding: 15px;
}
#messages {
  height: 55vh;
  min-height: 300px;
  overflow-y: auto;
  background: #1c293b;
  padding: 15px;
  border-radius: 12px;
}
.message {
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  line-height: 1.5;
}
.bot { background: #293c53; }
.user { background: #176c64; text-align: right; }
form { display: flex; gap: 8px; margin-top: 15px; }
input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 9px;
  border: 0;
  font-size: 16px;
}
button {
  padding: 13px;
  border: 0;
  border-radius: 9px;
  background: #55d6be;
  font-weight: bold;
}
footer { text-align: center; color: #aebccc; font-size: 12px; padding: 20px; }
</style>
</head>
<body>
<header>
  <h1>RHODA AI</h1>
  <p>Votre assistante intelligente de GROUPE RHODAMISSILE89</p>
</header>
<main>
  <div id="messages">
    <div class="message bot">
      Bonjour ! Je suis RHODA AI. Bienvenue ! Comment puis-je vous aider aujourd'hui ?
    </div>
  </div>
  <form id="chat">
    <input id="question" placeholder="Écrivez votre message..." required>
    <button type="button" id="micro">🎤 Parler</button>
<button type="button" id="ecouter">🔊 Écouter</button>
    <button type="submit">Envoyer</button>
  </form>
</main>
<footer>
  RHODA AI · GROUPE RHODAMISSILE89
</footer>
<script>
const form = document.getElementById("chat");
  let derniereReponse = "";
const input = document.getElementById("question");
const messages = document.getElementById("messages");

const micro = document.getElementById("micro");
const ecouter = document.getElementById("ecouter");


micro.addEventListener("click", () => {
  const Reconnaissance =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!Reconnaissance) {
    alert("La reconnaissance vocale n'est pas disponible dans ce navigateur.");
    return;
  }

  const reconnaissance = new Reconnaissance();
  reconnaissance.lang = "fr-FR";
  reconnaissance.start();

  reconnaissance.onresult = (event) => {
    input.value = event.results[0][0].transcript;
    form.requestSubmit();
  };
});

ecouter.addEventListener("click", () => {
  if (!derniereReponse) {
    alert("RHODA AI n'a pas encore répondu.");
    return;
  }


speechSynthesis.cancel();

const voix = new SpeechSynthesisUtterance(derniereReponse);
voix.lang = "fr-FR";


const voixDisponibles = speechSynthesis.getVoices();

const voixMasculine = voixDisponibles.find(v =>
  /Henri|Paul|Thomas|homme|male/i.test(v.name) &&
  v.lang.toLowerCase().startsWith("fr")
);

voix.voice = voixMasculine || null;
voix.lang = "fr-FR";
voix.rate = 0.92;
voix.pitch = 0.85;

speechSynthesis.speak(voix);




});

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const question = input.value.trim();
  if (!question) return;

  const user = document.createElement("div");
  user.className = "message user";
  user.textContent = question;
  messages.appendChild(user);
  input.value = "";

  const bot = document.createElement("div");
  bot.className = "message bot";
  bot.textContent = "RHODA AI réfléchit...";
  messages.appendChild(bot);

  try {
    const response = await fetch(
      "https://rhoda-ai-api.rhodamissile.workers.dev/",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: question })
      }
    );

    const result = await response.json();
    derniereReponse = result.reply || result.error || "Aucune réponse reçue.";
    derniereReponse = derniereReponse.replace(/\*/g, "");
bot.textContent = derniereReponse;
  } catch (error) {
    bot.textContent = "Connexion impossible avec RHODA AI.";
  }
});
</script>
</body>
</html>
